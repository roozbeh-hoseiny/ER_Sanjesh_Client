<uikit-field [label]="label" [for]="name" [control]="control">
  <input
    pInputText
    [formControl]="control"
    [attr.name]="name"
    [attr.placeholder]="placeholder"
    [attr.inputmode]="inputMode"
    [attr.maxlength]="maxLength || null"
    [attr.type]="htmlType"
    [class]="inputClass"
    [required]="isRequired"
    (input)="onInput($event)"
  />
</uikit-field>
