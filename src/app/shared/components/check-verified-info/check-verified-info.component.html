<div class="inline-flex items-center gap-2 flex-wrap">
  <span class="text-text-color text-base font-bold">
    {{ value || "-" }}
  </span>
  @if (inlineConfirmation) {
    <p-confirmpopup />
  }
  @if (value) {
    <p-button
      size="small"
      [title]="isVerified ? '' : notVerifiedMessage"
      [severity]="isVerified ? 'success' : 'warn'"
      [icon]="`pi pi-${isVerified ? 'check' : 'exclamation-triangle'}`"
      [loading]="toggleLoading"
      (onClick)="onClick($event)"
    ></p-button>
  }
</div>
