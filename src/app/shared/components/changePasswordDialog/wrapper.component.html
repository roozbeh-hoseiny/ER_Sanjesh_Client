<p-dialog
  [(visible)]="visible"
  [modal]="true"
  header="تغییر گذرواژه"
  [style]="{ width: '400px' }"
  (onHide)="visibleChange.emit(false)"
  [closable]="true"
>
  @if (activeStep() === "sendCode") {
    <change-password-send-code-step [apiRoute]="sendOtpApiRoute()" (onSubmit)="toOtp()" (onClose)="close()" />
  } @else {
    <change-password-otp-step
      [apiRoute]="changePasswordApiRoute()"
      [resendOTPApiRoute]="resendOtpApiRoute()"
      (onSubmit)="onPasswordChange()"
      (onClose)="close()"
    />
  }
</p-dialog>
