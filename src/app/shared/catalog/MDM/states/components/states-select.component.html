<div class="grid grid-cols-2 gap-4">
  <uikit-field label="استان" for="state" [control]="stateControl">
    <ng-container>
      <p-select
        name="state"
        [options]="states() || []"
        optionLabel="title"
        optionValue="id"
        [loading]="getStatesLoading()"
        [formControl]="stateControl"
      ></p-select>
    </ng-container>
  </uikit-field>

  @if (cityControl) {
    <ng-container>
      <uikit-field label="شهر" for="city" [control]="cityControl">
        <p-select
          name="city"
          optionLabel="title"
          optionValue="id"
          [options]="cities() || []"
          [loading]="getStatesLoading()"
          [attr.disabled]="!isSelectedState()"
          [formControl]="cityControl"
        ></p-select>
      </uikit-field>
    </ng-container>
  }
</div>
