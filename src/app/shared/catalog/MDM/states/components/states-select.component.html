<div class="grid grid-cols-2 gap-4">
  <uikit-field label="استان" for="state">
    <p-select
      name="state"
      [options]="states() || []"
      optionLabel="title"
      [loading]="getStatesLoading()"
      (onChange)="onStateSelect($event.value)"
    />
  </uikit-field>
  <uikit-field label="شهر" for="city">
    <p-select
      name="city"
      optionLabel="title"
      [options]="cities() || []"
      [loading]="getStatesLoading()"
      [disabled]="!selectedStateId()"
      (onChange)="onCitySelect($event.value)"
    />
  </uikit-field>
</div>
