<div class="grid grid-cols-2 gap-4">
  <uikit-field label="استان" for="state" [control]="stateControl">
    <ng-container *ngIf="stateFormControl as sfc">
      <p-select
        name="state"
        [options]="states() || []"
        optionLabel="title"
        [loading]="getStatesLoading()"
        [formControl]="sfc"
        (onChange)="onStateSelect($event.value)"
      ></p-select>
    </ng-container>
  </uikit-field>

  <ng-container *ngIf="cityFormControl as cfc">
    <uikit-field label="شهر" for="city" [control]="cityControl">
      <p-select
        name="city"
        optionLabel="title"
        [options]="cities() || []"
        [loading]="getStatesLoading()"
        [disabled]="!selectedStateId()"
        [formControl]="cfc"
        (onChange)="onCitySelect($event.value)"
      ></p-select>
    </uikit-field>
  </ng-container>
</div>
