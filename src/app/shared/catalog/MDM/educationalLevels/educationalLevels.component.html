<div class="flex flex-col gap-2">
  <label for="educational-level" class="font-semibold"> پایه تحصیلی</label>

  <p-select
    id="educational-level"
    [(ngModel)]="selectedLevel"
    [options]="educationalLevels()"
    optionLabel="title"
    placeholder="یکی از پایه‌های تحصیلی را انتخاب کنید"
    [loading]="loading()"
    [disabled]="loading()"
    (onChange)="onLevelChange($event)"
  />
</div>
