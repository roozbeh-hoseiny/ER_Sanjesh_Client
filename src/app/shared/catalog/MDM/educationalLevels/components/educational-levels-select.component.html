<uikit-field label="پایه تحصیلی" for="educational-level" [control]="control">
  <p-select
    name="educational-level"
    [formControl]="control"
    [options]="items()"
    optionLabel="title"
    optionValue="id"
    placeholder="یکی از پایه‌های تحصیلی را انتخاب کنید"
    appendTo="body"
    [loading]="loading()"
    [disabled]="loading() || disabled"
  />
</uikit-field>
