<uikit-field label="درس" [for]="name">
  <p-multiSelect
    [name]="name"
    [(ngModel)]="formControlName.value"
    [options]="items()"
    optionLabel="title"
    placeholder="درس‌ها را انتخاب کنید"
    [loading]="loading()"
    [disabled]="loading()"
    (onChange)="onSelectItem($event.value)"
  />
</uikit-field>
