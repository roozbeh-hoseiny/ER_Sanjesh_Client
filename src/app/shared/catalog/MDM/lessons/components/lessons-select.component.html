<uikit-field label="درس" [for]="name">
  <p-select
    [name]="name"
    [formControl]="control"
    [options]="filteredItems"
    optionLabel="fullTitle"
    placeholder="یکی از درس‌ها را انتخاب کنید"
    [loading]="loading()"
    [disabled]="loading()"
    (onChange)="onSelectItem($event.value)"
  />
</uikit-field>
