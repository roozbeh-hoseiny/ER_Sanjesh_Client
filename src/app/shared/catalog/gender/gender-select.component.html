<uikit-field label="جنسیت" name="gender" [control]="control">
  <ng-container *ngIf="formControl as fc">
    <p-select
      [options]="[
        { label: 'زن', id: false },
        { label: 'مرد', id: true },
      ]"
      [size]="size"
      [id]="'gender'"
      [optionValue]="'id'"
      [attr.name]="'gender'"
      [formControl]="fc"
      [invalid]="fc.invalid && (fc.dirty || fc.touched)"
    ></p-select>
  </ng-container>
</uikit-field>
