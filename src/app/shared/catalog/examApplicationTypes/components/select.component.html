@if (showLabel) {
  <uikit-field label="نوع آزمون" [name]="name">
    <p-select
      [name]="name"
      [formControl]="control"
      [options]="items"
      optionLabel="title"
      optionValue="id"
      placeholder="یکی از انواع آزمون را انتخاب کنید"
      (onChange)="onSelect($event.value)"
    />
  </uikit-field>
} @else {
  <p-select
    [name]="name"
    [formControl]="control"
    [options]="items"
    optionLabel="title"
    optionValue="id"
    placeholder="یکی از انواع آزمون را انتخاب کنید"
    (onChange)="onSelect($event.value)"
  />
}
