<div class="flex flex-col gap-1">
  <uikit-label [name]="name" [invalid]="!!invalid || showErrors">
    {{ label }}
  </uikit-label>
  <ng-content></ng-content>
  @if (showErrors) {
    <ng-container>
      <p-message severity="error" size="small" variant="simple" class="formHint">
        {{ errors[0] }}
      </p-message>
    </ng-container>
  }
</div>
