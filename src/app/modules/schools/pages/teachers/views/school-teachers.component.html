<app-page-data-list
  [pageTitle]="'مدیریت دبیران'"
  [addNewCtaLabel]="'افزودن دبیر جدید'"
  [columns]="columns"
  [showAdd]="true"
  [items]="activePageItems()"
  [loading]="loading()"
  [totalRecords]="totalRecords()"
  [currentPage]="activePageIndex() + 1"
  [perPage]="perPage()"
  style="height: 100cqmin"
  class="overflow-hidden"
  (pageChange)="onPageChange($event)"
  (onAdd)="openAddForm()"
  (onEdit)="openEditForm($event)"
>
</app-page-data-list>
