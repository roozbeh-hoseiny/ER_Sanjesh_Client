<form (ngSubmit)="submit()" [formGroup]="form" class="grid grid-cols-1 gap-4">
  <div class="grid grid-cols-3 gap-4">
    <app-input label="نام مرکز آموزشی" name="name" [control]="form.controls.name" />
    <app-school-genders-select [control]="form.controls.boyOrGirl" />
    <app-input label="ظرفیت" name="examHallCapacity" [control]="form.controls.examHallCapacity" />
    <uikit-field label="ظرفیت" for="examHallCapacity" [control]="form.controls.examHallCapacity">
      <input
        pInputText
        formControlName="examHallCapacity"
        required
        class="ltrInput"
        [invalid]="form.controls.examHallCapacity.invalid && form.controls.examHallCapacity.touched"
      />
    </uikit-field>
    <app-input label="شماره تماس" name="phoneNumber" [control]="form.controls.phoneNumber" />
  </div>
  <div [formGroup]="form.controls.managerInfo" class="grid grid-cols-1 gap-4">
    <p-divider align="center"> مدیریت </p-divider>
    <app-school-person-form
      [firstNameControl]="form.controls.managerInfo.controls.firstName"
      [lastNameControl]="form.controls.managerInfo.controls.lastName"
      [mobileControl]="form.controls.managerInfo.controls.mobile"
      [emailControl]="form.controls.managerInfo.controls.email"
      [genderControl]="form.controls.managerInfo.controls.gender"
    />
  </div>
  <div class="flex gap-2 justify-end mt-4">
    <button pButton type="button" class="p-button-secondary" (click)="close()">انصراف</button>
    <button pButton type="submit" class="p-button-primary" [loading]="onSubmitLoading()">ذخیره</button>
  </div>
</form>
