<div class="flex flex-col gap-6">
  <app-school-info (onSubmitted)="refreshData()" />
  @if (showContactCard) {
    <app-school-contact (onSubmit)="submitContact($event)" (onSubmitted)="refreshData()" />
  }
  <app-school-address (onSubmitted)="refreshData()" />
  @if (showTeachersCard) {
    <school-teachers-simple-list />
  }
  @if (showBankAccountsCard) {
    <app-school-info-bank-accounts />
  }
  <app-school-login-info (onSubmitted)="refreshData()" />
</div>
