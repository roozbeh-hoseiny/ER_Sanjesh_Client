<p-dialog
  header="فیلترهای دانش آموزان"
  [(visible)]="isMainFilterOpened"
  [modal]="true"
  [style]="{ width: '500px' }"
  modal
>
  <school-students-main-filters (onSubmit)="onSubmitMainFilter($event)" />
</p-dialog>

<div class="d-flex items-center w-full justify-center h-full">
  <button pButton type="button" class="p-button-plain" routerLink="/schools/students/bulk-add">
    افزودن دانش آموز جدید
  </button>
  <students-bulk-upload-dialog [(visible)]="openedUploadDialog" />
</div>
