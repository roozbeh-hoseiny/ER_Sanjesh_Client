<app-page-data-list
  [pageTitle]="'مدیریت دانش‌آموزان'"
  [columns]="columns"
  [items]="students || []"
  [loading]="loading()"
  addNewCtaLabel="افزودن تجمیعی دانش‌آموزان"
  [showAdd]="true"
  [showDetails]="true"
  style="height: 100cqmin"
  class="overflow-hidden"
  (onAdd)="toAddBulkPage()"
>
  <ng-template #caption let-columns>
    <school-students-main-filters (onSubmit)="onSubmitMainFilter($event)" />
  </ng-template>
</app-page-data-list>
