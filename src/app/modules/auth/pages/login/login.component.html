<div class="flex bg-primary-50 h-svh">
  <div class="w-2/5 min-w-xs shrink-0 flex justify-center items-center">
    <div
      class="flex flex-col items-center justify-center px-12 py-10 h-auto bg-surface-card border border-surface-border rounded-lg shadow"
    >
      <div class="flex flex-col gap-4 text-center mb-10 items-center justify-center">
        <img [src]="logo" alt="لوگو سازمان سنجش" class="w-20 h-auto" />
        <span class="text-lg font-bold"> به پنل آزمون آنلاین تشریحی خوش آمدید. </span>
      </div>

      <form [formGroup]="loginForm" class="w-full max-w-xs" (ngSubmit)="onSubmit()">
        <div class="flex flex-col gap-2 mb-4">
          <uikit-label for="username"> ایمیل </uikit-label>
          <input
            pInputText
            id="username"
            type="text"
            placeholder="آدرس ایمیل"
            class="w-full"
            pSize="large"
            formControlName="username"
          />
        </div>
        <div class="flex flex-col gap-2 mb-4">
          <uikit-label for="password1">رمز عبور</uikit-label>
          <p-password
            id="password1"
            size="large"
            formControlName="password"
            placeholder="رمز عبور"
            [toggleMask]="true"
            [fluid]="true"
            [feedback]="false"
          />
        </div>

        <!-- <div class="flex items-center justify-between mt-2 mb-8 gap-8">
          <div class="flex items-center">
            <p-checkbox formControlName="rememberMe" id="rememberMe" binary class="me-2"></p-checkbox>
            <uikit-label for="rememberMe" pSize="small">مرا به خاطر بسپار</uikit-label>
          </div>
          <span class="text-sm font-medium no-underline ms-2 text-right cursor-pointer text-primary">
            رمز را فراموش کردید؟
          </span>
        </div> -->
        <div class="mb-6 flex flex-col items-center gap-4">
          <div
            class="relative bg-surface-ground rounded-xl overflow-hidden shadow shrink-0 border border-[var(--p-inputtext-border-color)] w-[16rem] aspect-[2]"
          >
            <img p-image [src]="captchaImageSrc()" class="w-full object-contain" />
            @if (isCaptchaLoading()) {
              <div class="!absolute inset-0 bg-surface-hover/50 flex items-center justify-center">
                <p-progress-spinner
                  strokeWidth="4"
                  fill="transparent"
                  animationDuration="1s"
                  [style]="{ width: '48px', height: '48px' }"
                />
              </div>
            } @else if (isCaptchaExpired()) {
              <div
                class="!absolute inset-0 bg-surface-hover/70 flex items-center justify-center text-center p-2 text-sm font-medium cursor-pointer"
                (click)="onRefreshCaptcha()"
              >
                <i class="pi pi-refresh !text-3xl text-gray-500"></i>
              </div>
            }
          </div>
          <input
            pInputText
            id="captcha"
            pSize="small"
            type="text"
            placeholder="کد کپچا را وارد کنید"
            class="w-[12rem]"
            formControlName="captcha"
          />
        </div>
        <p-button label="ورود" styleClass="w-full" size="large" [loading]="isLoading" type="submit"></p-button>
      </form>
    </div>
  </div>
  <div class="grow bg-primary-100 h-svh items-center justify-center hidden md:flex">
    <img [src]="authVector" alt="background image" class="w-100 object-cover" />
  </div>
</div>
