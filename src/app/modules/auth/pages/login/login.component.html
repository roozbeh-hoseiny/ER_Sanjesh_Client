<div
  class="bg-surface-50 dark:bg-surface-950 flex items-center justify-center min-h-screen min-w-screen overflow-hidden">
  <div class="flex flex-col items-center justify-center">
    <div
      style="
        border-radius: 56px;
        padding: 0.3rem;
        background: linear-gradient(180deg, var(--primary-color) 10%, rgba(33, 150, 243, 0) 30%);
      ">
      <div class="w-full bg-surface-0 dark:bg-surface-900 py-20 px-8 sm:px-20" style="border-radius: 53px">
        <div class="text-center mb-8 flex items-center flex-col gap-4">
          <img [src]="logo" width="80" />
          <div class="text-surface-900 dark:text-surface-0 text-3xl font-medium">
            به پنل آزمون آنلاین تشریحی خوش آمدید
          </div>
          <span class="text-muted-color font-medium">برای ادامه وارد شوید</span>
        </div>

        <form [formGroup]="loginForm">
          <label for="email1" class="block text-surface-900 dark:text-surface-0 text-xl font-medium mb-2">ایمیل</label>
          <input
            pInputText
            id="email1"
            pSize="large"
            type="text"
            placeholder="آدرس ایمیل"
            class="w-full md:w-120 mb-8"
            formControlName="username" />

          <label for="password1" class="block text-surface-900 dark:text-surface-0 font-medium text-xl mb-2">
            رمز عبور
          </label>
          <p-password
            id="password1"
            size="large"
            formControlName="password"
            placeholder="رمز عبور"
            [toggleMask]="true"
            styleClass="mb-4"
            [fluid]="true"
            [feedback]="false" />

          <div class="flex items-center justify-between mt-2 mb-8 gap-8">
            <div class="flex items-center">
              <p-checkbox formControlName="rememberMe" id="rememberMe" binary class="me-2"></p-checkbox>
              <label for="rememberMe">مرا به خاطر بسپار</label>
            </div>
            <span class="font-medium no-underline ms-2 text-right cursor-pointer text-primary">
              رمز را فراموش کردید؟
            </span>
          </div>
          <p-button label="ورود" styleClass="w-full" size="large" routerLink="/"></p-button>
        </form>
      </div>
    </div>
  </div>
</div>
