<div class="w-full flex flex-col gap-4">
  @if (canChangeRole()) {
    <app-auth-select-roles />
  }

  @if (loginType() === "OTP") {
    <app-login-with-otp-form />
  } @else if (loginType() === "VOICE_OTP") {
    <app-login-with-voice-otp-form />
  } @else {
    <app-login-with-password-form />
  }
</div>
