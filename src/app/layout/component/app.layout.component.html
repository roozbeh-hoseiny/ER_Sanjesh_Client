<div class="layout-wrapper" [ngClass]="containerClass">
  <app-topbar></app-topbar>
  <app-sidebar></app-sidebar>
  <div class="layout-main-container">
    <div class="layout-main flex flex-col gap-4">
      <app-breadcrumb class="rounded-md overflow-hidden shrink-0" />
      <div class="bg-surface-overlay rounded-md overflow-hidden flex flex-col grow">
        <div class="h-full" style="container-type: size">
          <router-outlet></router-outlet>
        </div>
      </div>
    </div>
    <app-footer></app-footer>
  </div>
  <div class="layout-mask animate-fadein"></div>
</div>
